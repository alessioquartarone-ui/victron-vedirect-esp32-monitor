name: Build ESP32 firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Victron_Display_Web/**"
      - ".github/workflows/build.yml"

env:
  VERSION_CYD: "V10.5.3-CYD-PUBLIC-MULTIPROTOCOL-EPEVER"
  VERSION_ESP32_HEADLESS: "V10.5.3-ESP32-HEADLESS-PUBLIC-MULTIPROTOCOL-EPEVER"
  VERSION_ESP32S3_HEADLESS: "V10.5.3-ESP32S3-HEADLESS-PUBLIC-MULTIPROTOCOL-EPEVER"

jobs:
  build-all-targets:
    name: Build all public firmware targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 core
        run: |
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install "TFT_eSPI@2.5.43"
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "WiFiManager@2.0.17"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
          arduino-cli lib install "ModbusMaster@2.0.1"

      - name: Force TFT_eSPI setup for ESP32 CYD ILI9341
        run: |
          TFT_SETUP="/home/runner/Arduino/libraries/TFT_eSPI/User_Setup.h"

          echo "TFT setup path: $TFT_SETUP"

          if [ ! -d "/home/runner/Arduino/libraries/TFT_eSPI" ]; then
            echo "TFT_eSPI library folder not found"
            ls -la /home/runner/Arduino/libraries || true
            exit 1
          fi

          cat > "$TFT_SETUP" <<'EOF'
          #pragma once

          #define USER_SETUP_LOADED 1

          #define ILI9341_DRIVER

          #define TFT_WIDTH  240
          #define TFT_HEIGHT 320

          #define TFT_MISO 12
          #define TFT_MOSI 13
          #define TFT_SCLK 14
          #define TFT_CS   15
          #define TFT_DC    2
          #define TFT_RST  -1

          #define TFT_BL   21
          #define TFT_BACKLIGHT_ON HIGH

          #define LOAD_GLCD
          #define LOAD_FONT2
          #define LOAD_FONT4
          #define LOAD_FONT6
          #define LOAD_FONT7
          #define LOAD_FONT8
          #define LOAD_GFXFF
          #define SMOOTH_FONT

          #define SPI_FREQUENCY       10000000
          #define SPI_READ_FREQUENCY   5000000
          #define SPI_TOUCH_FREQUENCY  2500000
          EOF

          echo "Generated TFT_eSPI User_Setup.h:"
          cat "$TFT_SETUP"

      - name: Build ESP32 CYD ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashMode=qio,FlashFreq=80,CPUFreq=240,UploadSpeed=115200,DebugLevel=none,PSRAM=disabled" \
            --build-property compiler.cpp.extra_flags="-fpermissive -DVIC_TARGET_CYD_ILI9341" \
            --output-dir build/esp32-cyd-ili9341 \
            Victron_Display_Web

      - name: Prepare ESP32 CYD ILI9341 artifact
        run: |
          mkdir -p firmware/esp32-cyd-ili9341

          BIN_FILE="$(find build/esp32-cyd-ili9341 -name '*.bin' | grep -v bootloader | grep -v partitions | head -n1)"

          if [ -z "$BIN_FILE" ]; then
            echo "ESP32 CYD ILI9341 firmware .bin not found"
            find build/esp32-cyd-ili9341 -type f
            exit 1
          fi

          cp "$BIN_FILE" firmware/esp32-cyd-ili9341/latest.bin
          echo "$VERSION_CYD" > firmware/esp32-cyd-ili9341/version.txt
          sha256sum firmware/esp32-cyd-ili9341/latest.bin | awk '{print $1}' > firmware/esp32-cyd-ili9341/latest.sha256

          echo "ESP32 CYD ILI9341 artifact:"
          ls -lh firmware/esp32-cyd-ili9341

      - name: Build ESP32 Headless WebUI
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashMode=qio,FlashFreq=80,CPUFreq=240,UploadSpeed=115200,DebugLevel=none,PSRAM=disabled" \
            --build-property compiler.cpp.extra_flags="-fpermissive -DVIC_TARGET_ESP32_HEADLESS" \
            --output-dir build/esp32-headless \
            Victron_Display_Web

      - name: Prepare ESP32 Headless artifact
        run: |
          mkdir -p firmware/esp32-headless

          BIN_FILE="$(find build/esp32-headless -name '*.bin' | grep -v bootloader | grep -v partitions | head -n1)"

          if [ -z "$BIN_FILE" ]; then
            echo "ESP32 Headless firmware .bin not found"
            find build/esp32-headless -type f
            exit 1
          fi

          cp "$BIN_FILE" firmware/esp32-headless/latest.bin
          echo "$VERSION_ESP32_HEADLESS" > firmware/esp32-headless/version.txt
          sha256sum firmware/esp32-headless/latest.bin | awk '{print $1}' > firmware/esp32-headless/latest.sha256

          echo "ESP32 Headless artifact:"
          ls -lh firmware/esp32-headless

      - name: Build ESP32-S3 Headless WebUI
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PartitionScheme=min_spiffs,FlashMode=qio,CPUFreq=240,UploadSpeed=921600,DebugLevel=none,PSRAM=disabled" \
            --build-property compiler.cpp.extra_flags="-fpermissive -DVIC_TARGET_ESP32S3_HEADLESS" \
            --output-dir build/esp32s3-headless \
            Victron_Display_Web

      - name: Prepare ESP32-S3 Headless artifact
        run: |
          mkdir -p firmware/esp32s3-headless

          BIN_FILE="$(find build/esp32s3-headless -name '*.bin' | grep -v bootloader | grep -v partitions | head -n1)"

          if [ -z "$BIN_FILE" ]; then
            echo "ESP32-S3 Headless firmware .bin not found"
            find build/esp32s3-headless -type f
            exit 1
          fi

          cp "$BIN_FILE" firmware/esp32s3-headless/latest.bin
          echo "$VERSION_ESP32S3_HEADLESS" > firmware/esp32s3-headless/version.txt
          sha256sum firmware/esp32s3-headless/latest.bin | awk '{print $1}' > firmware/esp32s3-headless/latest.sha256

          echo "ESP32-S3 Headless artifact:"
          ls -lh firmware/esp32s3-headless

      - name: Upload ESP32 CYD ILI9341 artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-cyd-ili9341-firmware
          path: firmware/esp32-cyd-ili9341

      - name: Upload ESP32 Headless artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-headless-firmware
          path: firmware/esp32-headless

      - name: Upload ESP32-S3 Headless artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-headless-firmware
          path: firmware/esp32s3-headless

      - name: Publish OTA firmware
        if: github.event_name == 'workflow_dispatch'
        env:
          OTA_REPO_TOKEN: ${{ secrets.OTA_REPO_TOKEN }}
        run: |
          if [ -z "$OTA_REPO_TOKEN" ]; then
            echo "OTA_REPO_TOKEN secret is not configured. Skipping OTA publish."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${OTA_REPO_TOKEN}@github.com/alessioquartarone-ui/victron-vedirect-esp32-monitor-ota.git ota-repo

          mkdir -p ota-repo/firmware/esp32-cyd-ili9341
          mkdir -p ota-repo/firmware/esp32-headless
          mkdir -p ota-repo/firmware/esp32s3-headless

          cp firmware/esp32-cyd-ili9341/latest.bin ota-repo/firmware/esp32-cyd-ili9341/latest.bin
          cp firmware/esp32-cyd-ili9341/version.txt ota-repo/firmware/esp32-cyd-ili9341/version.txt
          cp firmware/esp32-cyd-ili9341/latest.sha256 ota-repo/firmware/esp32-cyd-ili9341/latest.sha256

          cp firmware/esp32-headless/latest.bin ota-repo/firmware/esp32-headless/latest.bin
          cp firmware/esp32-headless/version.txt ota-repo/firmware/esp32-headless/version.txt
          cp firmware/esp32-headless/latest.sha256 ota-repo/firmware/esp32-headless/latest.sha256

          cp firmware/esp32s3-headless/latest.bin ota-repo/firmware/esp32s3-headless/latest.bin
          cp firmware/esp32s3-headless/version.txt ota-repo/firmware/esp32s3-headless/version.txt
          cp firmware/esp32s3-headless/latest.sha256 ota-repo/firmware/esp32s3-headless/latest.sha256

          cd ota-repo

          git add firmware/esp32-cyd-ili9341/latest.bin
          git add firmware/esp32-cyd-ili9341/version.txt
          git add firmware/esp32-cyd-ili9341/latest.sha256

          git add firmware/esp32-headless/latest.bin
          git add firmware/esp32-headless/version.txt
          git add firmware/esp32-headless/latest.sha256

          git add firmware/esp32s3-headless/latest.bin
          git add firmware/esp32s3-headless/version.txt
          git add firmware/esp32s3-headless/latest.sha256

          if git diff --cached --quiet; then
            echo "No OTA changes to publish."
            exit 0
          fi

          git commit -m "Publish public multiprotocol EPEVER firmware V10.5.3"
          git push
